name: CI

on:
  pull_request:
  # Long-lived wip/* branches may be conflicted with main; GitHub skips
  # pull_request workflows until conflicts are resolved (see Actions docs).
  push:
    branches:
      - wip/member-site-redesign

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Install, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # TODO: Re-enable lint after the member-site redesign lands — ~300 pre-existing ESLint errors to clean up.
      - name: Lint
        if: false
        run: npm run lint

      - name: Build
        run: npm run build